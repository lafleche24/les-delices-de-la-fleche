:root{--teal:#087f78;--dark:#075956;--gold:#c99b3c;--ink:#293a38}*{box-sizing:border-box}body{margin:0;background:#f4f1e9;color:var(--ink);font:16px/1.55 Arial,sans-serif}header{background:linear-gradient(135deg,#075956,#0b8f86);color:white;text-align:center;padding:40px 16px;border-bottom:6px solid var(--gold)}.brand{color:#f6d98f;letter-spacing:2px;text-transform:uppercase;font-size:13px;font-weight:bold}h1{font: bold clamp(30px,5vw,48px) Georgia,serif;margin:10px 0}header p{max-width:760px;margin:auto}

;font-size:14px}footer{text-align:center;background:#075956;color:#eef8f2;padding:25px;border-top:5px solid var(--gold)}@media(max-width:700px){.recipe{display:flex;flex-direction:column}.dish{max-height:none;overflow:hidden}.dish img{height:220px}.body{padding:17px}.ingredients{columns:1}}@media print{nav{display:none}.recipe{break-inside:avoid;box-shadow:none}}
